# Revue de code agentique : un agent relit chaque PR, vérifie ses constats, commente et propose
# des correctifs. Il n'approuve jamais et ne fusionne jamais : le jugement final reste humain.
# Inactif tant que le secret CLAUDE_CODE_OAUTH_TOKEN n'est pas posé (Settings → Secrets and variables → Actions).
name: Revue agentique

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: read
  actions: read
  id-token: write

concurrency:
  group: revue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revue:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Secret absent → revue ignorée
        if: env.CLAUDE_TOKEN == ''
        run: echo "::notice::Revue agentique désactivée (secret CLAUDE_CODE_OAUTH_TOKEN absent)."

      - uses: actions/checkout@v4
        if: env.CLAUDE_TOKEN != ''
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: env.CLAUDE_TOKEN != ''
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Les correctifs poussés par l'agent @claude relancent la revue (la boucle du schéma).
          allowed_bots: "claude"
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
          prompt: |
            Tu es l'agent de revue de Ask Desailly (clone conversationnel, Vercel), dépôt ${{ github.repository }}, PR n° ${{ github.event.pull_request.number }}.
            Tu ne modifies aucun fichier, tu n'approuves pas, tu ne fusionnes pas. Tu écris en français, ton direct, sans emoji.

            1. CONTEXTE — lis, dans cet ordre :
               - CLAUDE.md et .github/regles-revue.md (ton référentiel, il prime sur tes habitudes) ;
               - la PR : `gh pr view $PR --comments` (intention, ticket lié, échanges précédents) ;
               - le ticket lié s'il existe : `gh issue view <n>` ;
               - le diff : `gh pr diff $PR` ;
               - l'état de la CI : `gh pr checks $PR` (tu le cites, tu ne refais pas son travail).
               Si un de tes commentaires de synthèse existe déjà, c'est une nouvelle passe : concentre-toi sur les
               commits poussés depuis et indique pour chaque constat précédent s'il est corrigé.

            2. ANALYSE — relis le code autour de chaque changement (appelants, fonctions api/, lib/, corpus et garde-fou exposable, tableau de bord admin)
               avec Read, Grep et Glob. Cherche d'abord les risques Bloquant, puis Important, puis Mineur.

            3. VÉRIFICATION — pour chaque constat candidat, applique le filtre anti faux positifs de
               .github/regles-revue.md. Écarte tout ce que tu ne peux pas étayer par un scénario concret.
               Dix constats au maximum ; mieux vaut trois constats sûrs que dix douteux.

            4. COMMENTAIRES — un commentaire en ligne par constat retenu, avec
               mcp__github_inline_comment__create_inline_comment : gravité en tête (**Bloquant**, **Important**
               ou **Mineur**), le scénario de défaillance en une phrase, puis le correctif. Quand le correctif tient
               en quelques lignes du fichier commenté, donne-le dans un bloc ```suggestion pour qu'il s'applique
               en un clic.

            5. SYNTHÈSE — un seul commentaire de synthèse, mis à jour à chaque passe :
               écris-le dans /tmp/synthese.md puis `gh pr comment $PR --edit-last --create-if-none --body-file /tmp/synthese.md`.
               Contenu, court :
               - **Verdict** : « Corrections demandées » s'il reste un Bloquant ou un Important, sinon « Prêt pour le jugement humain » ;
               - un tableau Gravité | Fichier | Constat | État (nouveau / corrigé / toujours ouvert) ;
               - **Intention à valider par l'humain** : une phrase reformulant ce que la PR cherche à faire, et la question
                 de fond que seul Alex peut trancher (produit, marché, juridique), s'il y en a une ;
               - **Pour enchaîner** : « Répondez `@claude corrige les points Bloquant et Important` pour que l'agent applique
                 les correctifs ; la revue repartira seule après son commit. »
               - constats écartés par le filtre : leur nombre seulement.
